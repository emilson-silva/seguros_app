name: seguros_app
description: Desafio técnico Flutter - app de seguros (mobile + web) com BLoC, Firebase Auth e Firestore.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5
  go_router: ^14.6.0
  get_it: ^8.0.0
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  mask_text_input_formatter: ^2.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.1.0
  firebase_auth_mocks: ^0.14.1

flutter:
  uses-material-design: true
